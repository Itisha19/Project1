<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creature Codex — Browse</title>
<style>
  :root{
    --bg-a: #EFEAFB;
    --bg-b: #E8F0FB;
    --ink: #1B2140;
    --ink-soft: #6B7290;
    --card-bg: #FFFFFF;
    --pill-bg: #FFFFFF;
    --radius-lg: 22px;
    --radius-md: 16px;
    --shadow: 0 10px 30px rgba(40,40,90,0.08);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-a), var(--bg-b));
    padding: 32px 16px;
    display:flex;
    justify-content:center;
  }

  .page{
    width: min(1320px, 100%);
    position:relative;
  }

  .frame{
    position:relative;
    background: rgba(255,255,255,0.35);
    border-radius: 32px;
    padding: 28px clamp(20px, 4vw, 56px) 40px;
    overflow:hidden;
  }

  /* header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 26px;
  }

  .icon-btn{
    width: 44px;
    height: 44px;
    border-radius: 14px;
    border:none;
    background: #fff;
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: var(--ink);
  }
  .icon-btn:hover{ filter: brightness(0.97); }

  .wordmark{
    font-size: clamp(26px, 4vw, 40px);
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--ink);
    text-align:center;
  }
  .wordmark span{ color: #7C5CF0; }

  /* search row */
  .search-row{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .search-box{
    flex: 1 1 320px;
    display:flex;
    align-items:center;
    gap: 10px;
    background: #fff;
    border-radius: 999px;
    padding: 14px 20px;
    box-shadow: var(--shadow);
  }
  .search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
  }
  .search-box input::placeholder{ color: #9AA0BC; }
  .search-box svg{ flex-shrink:0; color:#9AA0BC; }

  .filter-pill{
    display:flex;
    align-items:center;
    gap: 8px;
    background:#fff;
    border-radius: 999px;
    padding: 14px 20px;
    box-shadow: var(--shadow);
    font-size: 14px;
    color: var(--ink);
    cursor:pointer;
    border:none;
    white-space:nowrap;
  }

  .sort-btn{
    width: 48px;
    height: 48px;
    border-radius: 999px;
  }

  /* grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 36px;
  }

  .card{
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 18px 18px 20px;
    position:relative;
    display:flex;
    flex-direction:column;
    border-bottom: 5px solid var(--accent, #7C5CF0);
    transition: transform 0.2s ease;
  }
  .card:hover{ transform: translateY(-4px); }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .card-id{
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .fav-btn{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #ECECF4;
    background: #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: #C6C9DE;
    transition: color 0.2s, border-color 0.2s;
  }
  .fav-btn.active{ color: #F0507A; border-color: #F0507A; }
  .fav-btn svg{ width:16px; height:16px; }

  .type-icon{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin: 6px 0 10px;
    font-size: 12px;
  }

  .creature-img{
    width: 100%;
    aspect-ratio: 1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 12px;
  }
  .creature-img svg{ width: 78%; height: 78%; }

  .card-name{
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0 12px;
  }

  .card-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .type-badge{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 999px;
    letter-spacing: 0.3px;
  }

  .go-btn{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #ECECF4;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: var(--ink);
    flex-shrink:0;
    transition: background 0.2s;
  }
  .go-btn:hover{ background:#F4F4FA; }

  /* footer feature row */
  .features{
    background: rgba(255,255,255,0.6);
    border-radius: var(--radius-lg);
    padding: 26px clamp(16px, 3vw, 40px);
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .feature{
    display:flex;
    align-items:flex-start;
    gap: 14px;
  }
  .feature-icon{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size: 18px;
  }
  .feature h4{
    margin: 0 0 4px;
    font-size: 15px;
    color: var(--ink);
  }
  .feature p{
    margin:0;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .footer-note{
    text-align:center;
    margin-top: 26px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .empty-state{
    grid-column: 1 / -1;
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }

  @media (max-width: 980px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
    .features{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px){
    .grid{ grid-template-columns: 1fr; }
    .features{ grid-template-columns: 1fr; }
    .topbar{ flex-wrap: wrap; gap: 12px; }
    .wordmark{ order: 3; width:100%; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="frame">

    <header class="topbar">
      <button class="icon-btn" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="wordmark">Creature<span>Codex</span></div>
      <button class="icon-btn" aria-label="Toggle theme" id="themeBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="search-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search for a creature...">
      </div>
      <button class="filter-pill" id="filterBtn">
        Filter by types <span id="filterCount">(0)</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="filter-pill sort-btn" id="sortBtn" aria-label="Sort">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon" style="background:#E6ECFD; color:#3D5CE0;">◎</div>
        <div><h4>Explore</h4><p>Discover all your favorite creatures</p></div>
      </div>
      <div class="feature">
        <div class="feature-icon" style="background:#E4F5E8; color:#3FA85C;">🌿</div>
        <div><h4>Filter</h4><p>Find creatures by types and abilities</p></div>
      </div>
      <div class="feature">
        <div class="feature-icon" style="background:#FDF1DC; color:#E0A83D;">★</div>
        <div><h4>Collection</h4><p>Save and manage your collection</p></div>
      </div>
      <div class="feature">
        <div class="feature-icon" style="background:#F1E6FB; color:#8B4FE0;">☰</div>
        <div><h4>Stats</h4><p>View stats and learn about creatures</p></div>
      </div>
    </div>

    <p class="footer-note">© 2026 Creature Codex. All rights reserved.</p>
  </div>
</div>

<script>
  const TYPE_COLORS = {
    grass:   { bg:'#E4F5E8', fg:'#3FA85C' },
    dark:    { bg:'#E7E7F0', fg:'#4A4E6B' },
    steel:   { bg:'#EAEEF3', fg:'#6E7B8B' },
    fire:    { bg:'#FDEBE4', fg:'#E0602F' },
    water:   { bg:'#E3EEFB', fg:'#2E7BD6' },
    psychic: { bg:'#F5E6F7', fg:'#B14FC4' }
  };

  const creatures = [
    {
      id: '0908', name: 'Foliadon', types: ['grass'], accent:'#3FA85C',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="150" rx="55" ry="14" fill="#000" opacity="0.06"/>
        <path d="M100 40 Q60 70 65 130 Q70 165 100 175 Q130 165 135 130 Q140 70 100 40Z" fill="#2E6B4F"/>
        <path d="M100 55 Q75 80 80 125 Q84 152 100 160 Q116 152 120 125 Q125 80 100 55Z" fill="#EAF3E3"/>
        <circle cx="88" cy="95" r="6" fill="#1B2140"/><circle cx="112" cy="95" r="6" fill="#1B2140"/>
        <path d="M100 30 L110 15 L120 32Z" fill="#C9A6E8"/></svg>`
    },
    {
      id: '0624', name: 'Blaydrone', types: ['dark','steel'], accent:'#6E7B8B',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="150" rx="55" ry="14" fill="#000" opacity="0.06"/>
        <path d="M60 60 L140 60 L100 140Z" fill="#3D4152"/>
        <path d="M30 90 L95 100 L60 130Z" fill="#4C7FD6"/>
        <path d="M170 90 L105 100 L140 130Z" fill="#B9C2CF"/>
        <circle cx="100" cy="95" r="10" fill="#FFC93C"/>
        <rect x="85" y="140" width="12" height="35" fill="#3D4152"/>
        <rect x="103" y="140" width="12" height="35" fill="#3D4152"/></svg>`
    },
    {
      id: '0229', name: 'Cindrake', types: ['dark','fire'], accent:'#E0602F',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="160" rx="60" ry="12" fill="#000" opacity="0.06"/>
        <path d="M70 60 Q60 40 50 55 Q65 65 70 80Z" fill="#8B8FA3"/>
        <path d="M130 60 Q140 40 150 55 Q135 65 130 80Z" fill="#8B8FA3"/>
        <ellipse cx="100" cy="110" rx="45" ry="40" fill="#3D4152"/>
        <path d="M85 95 L100 108 L115 95 L110 118 L90 118Z" fill="#E0A94A"/>
        <circle cx="82" cy="95" r="5" fill="#FFC93C"/><circle cx="118" cy="95" r="5" fill="#FFC93C"/>
        <path d="M145 110 Q170 100 165 130 Q180 140 160 150" stroke="#1B2140" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="75" y="145" width="10" height="30" fill="#3D4152"/><rect x="115" y="145" width="10" height="30" fill="#3D4152"/></svg>`
    },
    {
      id: '0686', name: 'Mushimbo', types: ['dark','psychic'], accent:'#B14FC4',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="160" rx="55" ry="12" fill="#000" opacity="0.06"/>
        <path d="M50 90 Q100 40 150 90 Q140 100 100 95 Q60 100 50 90Z" fill="#C9A6E8"/>
        <circle cx="75" cy="70" r="5" fill="#FFE066"/><circle cx="100" cy="60" r="5" fill="#FFE066"/><circle cx="125" cy="70" r="5" fill="#FFE066"/>
        <ellipse cx="100" cy="130" rx="42" ry="45" fill="#D8A24A"/>
        <circle cx="85" cy="120" r="9" fill="#fff"/><circle cx="115" cy="120" r="9" fill="#fff"/>
        <circle cx="85" cy="120" r="4" fill="#1B2140"/><circle cx="115" cy="120" r="4" fill="#1B2140"/></svg>`
    },
    {
      id: '0143', name: 'Aquorra', types: ['water'], accent:'#2E7BD6',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="160" rx="55" ry="12" fill="#000" opacity="0.06"/>
        <ellipse cx="100" cy="110" rx="50" ry="55" fill="#4C9FE0"/>
        <path d="M60 80 Q40 60 45 40 Q65 55 70 75Z" fill="#3A82C4"/>
        <path d="M140 80 Q160 60 155 40 Q135 55 130 75Z" fill="#3A82C4"/>
        <circle cx="85" cy="105" r="7" fill="#1B2140"/><circle cx="115" cy="105" r="7" fill="#1B2140"/>
        <path d="M85 135 Q100 145 115 135" stroke="#1B2140" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`
    },
    {
      id: '0311', name: 'Verdilla', types: ['grass','psychic'], accent:'#3FA85C',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="160" rx="55" ry="12" fill="#000" opacity="0.06"/>
        <ellipse cx="100" cy="115" rx="48" ry="50" fill="#7AC48A"/>
        <path d="M100 60 Q80 30 60 40 Q75 55 80 70Z" fill="#4E9E63"/>
        <path d="M100 60 Q120 30 140 40 Q125 55 120 70Z" fill="#4E9E63"/>
        <circle cx="85" cy="110" r="6" fill="#1B2140"/><circle cx="115" cy="110" r="6" fill="#1B2140"/>
        <circle cx="60" cy="95" r="10" fill="#F3D6E8"/><circle cx="140" cy="95" r="10" fill="#F3D6E8"/></svg>`
    },
    {
      id: '0452', name: 'Ferronox', types: ['steel','fire'], accent:'#E0A83D',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="160" rx="55" ry="12" fill="#000" opacity="0.06"/>
        <ellipse cx="100" cy="115" rx="50" ry="48" fill="#9AA3B5"/>
        <path d="M65 80 L50 50 L80 68Z" fill="#E0602F"/>
        <path d="M135 80 L150 50 L120 68Z" fill="#E0602F"/>
        <circle cx="85" cy="112" r="7" fill="#FFC93C"/><circle cx="115" cy="112" r="7" fill="#FFC93C"/>
        <rect x="80" y="150" width="12" height="25" fill="#6E7B8B"/><rect x="108" y="150" width="12" height="25" fill="#6E7B8B"/></svg>`
    },
    {
      id: '0587', name: 'Nocturine', types: ['dark'], accent:'#4A4E6B',
      svg: `<svg viewBox="0 0 200 200"><ellipse cx="100" cy="160" rx="55" ry="12" fill="#000" opacity="0.06"/>
        <path d="M50 90 Q100 130 150 90 L150 130 Q100 165 50 130Z" fill="#3D4152"/>
        <path d="M60 90 Q40 60 55 40 Q70 60 75 85Z" fill="#2A2E3D"/>
        <path d="M140 90 Q160 60 145 40 Q130 60 125 85Z" fill="#2A2E3D"/>
        <circle cx="85" cy="100" r="6" fill="#FFE066"/><circle cx="115" cy="100" r="6" fill="#FFE066"/></svg>`
    }
  ];

  const TYPE_ICON = { grass:'🌿', dark:'●', steel:'⬡', fire:'🔥', water:'💧', psychic:'✦' };

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const filterBtn = document.getElementById('filterBtn');
  const filterCount = document.getElementById('filterCount');
  const sortBtn = document.getElementById('sortBtn');

  let activeTypes = new Set();
  let favorites = new Set();
  let sortAsc = true;

  function typeBadge(type){
    const c = TYPE_COLORS[type];
    return `<span class="type-badge" style="background:${c.bg}; color:${c.fg};">${TYPE_ICON[type]||''} ${type.toUpperCase()}</span>`;
  }

  function render(){
    let list = creatures.filter(c => {
      const matchesSearch = c.name.toLowerCase().includes(searchInput.value.trim().toLowerCase());
      const matchesType = activeTypes.size === 0 || c.types.some(t => activeTypes.has(t));
      return matchesSearch && matchesType;
    });

    list.sort((a,b) => sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));

    grid.innerHTML = '';

    if(list.length === 0){
      grid.innerHTML = `<div class="empty-state">No creatures match your search.</div>`;
      return;
    }

    list.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--accent', c.accent);

      const typeIcons = c.types.map(t => `<span class="type-icon" style="background:${TYPE_COLORS[t].bg}; color:${TYPE_COLORS[t].fg};">${TYPE_ICON[t]}</span>`).join('');
      const typeBadges = c.types.map(typeBadge).join('');
      const isFav = favorites.has(c.id);

      card.innerHTML = `
        <div class="card-top">
          <span class="card-id">#${c.id}</span>
          <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${c.id}" aria-label="Toggle favorite">
            <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-10-9.5C0.5 7.5 3 4 6.5 4c2 0 3.5 1.2 5.5 3.5C14 5.2 15.5 4 17.5 4 21 4 23.5 7.5 22 11.5 19 16.65 12 21 12 21Z"/></svg>
          </button>
        </div>
        
        <div style="display:flex; gap:6px;">${typeIcons}</div>
        <div class="creature-img">${c.svg}</div>
        <div class="card-name">${c.name}</div>
        <div class="card-bottom">
          <div style="display:flex; flex-wrap:wrap; gap:6px;">${typeBadges}</div>
          <button class="go-btn" aria-label="View ${c.name}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      `;
      grid.appendChild(card);
    });

    document.querySelectorAll('.fav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        favorites.has(id) ? favorites.delete(id) : favorites.add(id);
        render();
      });
    });
  }

  searchInput.addEventListener('input', render);

  filterBtn.addEventListener('click', () => {
    const allTypes = Object.keys(TYPE_COLORS);
    const next = allTypes[(allTypes.findIndex(t => activeTypes.has(t)) + 1) % (allTypes.length + 1)];
    // simple cycle: cycle through single-type filters, then clear
    if(activeTypes.size === 0){
      activeTypes = new Set([allTypes[0]]);
    } else {
      const current = [...activeTypes][0];
      const idx = allTypes.indexOf(current);
      if(idx === allTypes.length - 1){
        activeTypes = new Set();
      } else {
        activeTypes = new Set([allTypes[idx + 1]]);
      }
    }
    filterCount.textContent = `(${activeTypes.size})`;
    render();
  });

  sortBtn.addEventListener('click', () => {
    sortAsc = !sortAsc;
    render();
  });

  document.getElementById('themeBtn').addEventListener('click', () => {
    document.body.classList.toggle('dark-preview');
  });

  render();
</script>

</body>
</html>
